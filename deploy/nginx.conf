# Example Nginx configuration for the AlyanaGlobal Device Guard backend
#
# This configuration proxies requests from a public domain (e.g.
# api.alyanaglobal.com) to the FastAPI application running on
# localhost:8000.  Adjust the server_name, certificate paths and
# upstream address as needed.  In production you should enforce TLS
# with certificates issued via Let's Encrypt or another CA.

server {
    listen 80;
    server_name api.alyanaglobal.com;

    # Redirect HTTP to HTTPS if certificates are configured.  Remove
    # this block if you are not serving HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.alyanaglobal.com;

    # Replace these with the actual paths to your certificate and key
    ssl_certificate     /etc/letsencrypt/live/api.alyanaglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alyanaglobal.com/privkey.pem;

    # Security hardening (optional)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Proxy all requests to the FastAPI application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}